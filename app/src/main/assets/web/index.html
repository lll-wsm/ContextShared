<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>内容共享 - 极速跨端互联</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 顶部状态栏 -->
    <header class="app-header">
        <div class="header-left">
            <div class="logo"><img src="logo.png" alt="ContextShared Logo" class="logo-img"> <span id="appLogoText">内容共享</span></div>
            <div class="device-tag" id="deviceTag">Phone</div>
        </div>
        <div class="header-right">
            <button class="lang-btn" id="langSwitchBtn" title="Switch Language / 切换语言">🌐 中/EN</button>
            <div class="status-indicator connected" id="statusIndicator">
                <span class="status-dot"></span>
                <span class="status-text" id="statusText" data-i18n="connected">已连接</span>
            </div>
            <div class="battery-tag" id="batteryTag">🔋 85%</div>
        </div>
    </header>

    <main class="container">
        <!-- 快速双向操作面板 -->
        <div class="dashboard-grid">
            <!-- 剪贴板与文本传输 -->
            <section class="card clip-card">
                <div class="card-header">
                    <h2 data-i18n="clipTitle">📋 剪贴板同步</h2>
                    <span class="badge" id="clipStatus" data-i18n="clipBadge">实时监听中</span>
                </div>
                <div class="card-body">
                    <div class="latest-clip-box" id="latestClipBox">
                        <div class="clip-label" data-i18n="phoneRecentClip">手机端最近复制：</div>
                        <div class="clip-content" id="phoneClipContent">暂无内容 · 在手机上复制后切回本 App 即可同步</div>
                        <button class="btn btn-secondary btn-sm" id="btnCopyPhoneClip" data-i18n="copyToPc">复制到电脑</button>
                    </div>

                    <div class="send-text-box">
                        <textarea id="textToSend" data-i18n-placeholder="textPlaceholder" placeholder="输入要发送到手机的文本或网址... (按 Ctrl/Cmd+Enter 发送)"></textarea>
                        <div class="btn-group">
                            <button class="btn btn-primary" id="btnSendClipboard" data-i18n="sendToClipboard">📤 发送到手机剪贴板</button>
                            <button class="btn btn-outline" id="btnOpenUrl" data-i18n="openInPhone">🌐 手机浏览器打开</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 文件拖拽上传 -->
            <section class="card upload-card">
                <div class="card-header">
                    <h2 data-i18n="fileTransferTitle">📁 文件极速快传</h2>
                    <span class="badge" data-i18n="dragDropBadge">拖拽即传</span>
                </div>
                <div class="card-body">
                    <div class="dropzone" id="dropzone">
                        <div class="dropzone-icon">☁️</div>
                        <div class="dropzone-text"><span data-i18n="dropzoneText">将文件拖拽至此，或</span> <span class="dropzone-btn" data-i18n="dropzoneBtn">点击选择文件</span></div>
                        <input type="file" id="fileInput" multiple style="display: none;">
                    </div>

                    <div class="upload-progress-list" id="uploadList"></div>
                </div>
            </section>
        </div>

        <!-- 手机文件管理与浏览 -->
        <section class="card files-section">
            <div class="card-header">
                <h2 data-i18n="phoneFilesTitle">📂 手机文件库</h2>
                <span class="badge" id="volumeTag" data-i18n="volumeInternal">内部存储</span>
            </div>
            <div class="card-body">
                <div class="perm-banner" id="permBanner" style="display: none;">
                    <span data-i18n="permBannerText">未授予「所有文件访问权限」，当前只能看到媒体文件和共享目录</span>
                    <button class="btn btn-primary btn-sm" id="btnGrantAccess" data-i18n="grantAccess">去手机授权</button>
                    <span class="perm-banner-hint" id="permGrantHint"></span>
                </div>
                <!-- 导航条 -->
                <div class="path-bar">
                    <button class="btn btn-secondary btn-sm" id="btnStorage" data-i18n="storageBtn">存储</button>
                    <button class="btn btn-secondary btn-sm" id="btnGoUp" title="上级目录">⬆</button>
                    <div class="breadcrumb" id="breadcrumb"></div>
                    <button class="btn btn-secondary btn-sm" id="btnToggleView">☰ 列表</button>
                </div>

                <!-- 工具条：筛选 / 排序 / 搜索 / 上传 -->
                <div class="tool-bar">
                    <input type="text" id="filterInput" class="mini-input" data-i18n-placeholder="filterPlaceholder" placeholder="筛选当前目录…">
                    <select id="sortSelect" class="mini-input" title="排序方式">
                        <option value="name" data-i18n="sortName">名称</option>
                        <option value="size" data-i18n="sortSize">大小</option>
                        <option value="time" data-i18n="sortTime">修改时间</option>
                    </select>
                    <button class="btn btn-secondary btn-sm" id="btnSortDir" title="升序/降序">↑</button>
                    <span class="tool-spacer"></span>
                    <button class="btn btn-secondary btn-sm" id="btnSearchToggle" data-i18n="searchBtn">🔍 搜索</button>
                    <button class="btn btn-secondary btn-sm" id="btnRefreshDir" data-i18n="refreshDir">刷新</button>
                    <button class="btn btn-secondary btn-sm" id="btnUploadDir" data-i18n="uploadFolder">上传文件夹</button>
                    <button class="btn btn-primary btn-sm" id="btnUploadHere" data-i18n="uploadHere">上传到此目录</button>
                </div>

                <!-- 搜索条（点🔍后展开） -->
                <div class="tool-bar" id="searchBar" style="display: none;">
                    <input type="text" id="searchInput" class="mini-input grow" data-i18n-placeholder="searchPlaceholder" placeholder="在当前目录及子目录里搜文件名…">
                    <button class="btn btn-primary btn-sm" id="btnSearchGo" data-i18n="searchGo">开始搜索</button>
                    <button class="btn btn-secondary btn-sm" id="btnSearchExit" data-i18n="searchExit">退出搜索</button>
                    <span class="perm-banner-hint" id="searchHint"></span>
                </div>

                <!-- 多选 / 批量操作条 -->
                <div class="batch-bar" id="batchBar">
                    <label class="check-label"><input type="checkbox" id="selectAll"> <span data-i18n="selectAll">全选</span></label>
                    <span class="batch-count" id="selectedCount" data-i18n="selectedNone">已选 0 项</span>
                    <button class="btn btn-primary btn-sm" id="btnBatchDownload" data-i18n="downloadSelected">下载选中</button>
                    <button class="btn btn-secondary btn-sm" id="btnBatchZip" data-i18n="zipSelected">打包 ZIP</button>
                    <button class="btn btn-secondary btn-sm" id="btnClearSelection" data-i18n="clearSelection">取消选择</button>
                    <span class="perm-banner-hint" id="batchHint"></span>
                </div>

                <input type="file" id="dirInput" webkitdirectory directory multiple style="display: none;">

                <div class="file-grid list" id="fileGrid">
                    <div class="loading-spinner" data-i18n="loading">加载中...</div>
                </div>
            </div>
        </section>
    </main>

    <!-- 预览遮罩（图片 / 视频 / 音频 / PDF） -->
    <div class="preview-overlay" id="previewOverlay" style="display: none;">
        <div class="preview-head">
            <span class="preview-name" id="previewName"></span>
            <a class="btn btn-secondary btn-sm" id="previewDownload" data-i18n="download">下载</a>
            <button class="btn btn-primary btn-sm" id="previewClose">✕</button>
        </div>
        <div class="preview-body" id="previewBody"></div>
    </div>

    <!-- PIN 码配对弹窗 -->
    <div class="modal-overlay" id="pinModal">
        <div class="modal-card">
            <h3 data-i18n="pinModalTitle">🔒 设备配对验证</h3>
            <p data-i18n="pinModalDesc">请输入手机屏幕上显示的 4 位连接验证码：</p>
            <div class="pin-inputs">
                <input type="text" maxlength="4" id="pinCodeInput" data-i18n-placeholder="pinInputPlaceholder" placeholder="输入4位PIN码" autofocus>
            </div>
            <button class="btn btn-primary btn-block" id="btnSubmitPin" data-i18n="pinSubmitBtn">验证并连接</button>
        </div>
    </div>

    <!-- 全屏拖拽提示遮罩 -->
    <div class="drag-overlay" id="dragOverlay">
        <div class="drag-overlay-content">
            <div class="drag-icon">📥</div>
            <h2 data-i18n="dragOverlayText">松开鼠标即可立即上传至手机</h2>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
